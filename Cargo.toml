[package]
name = "exwall"
version = "0.5.1"
edition = "2024"
rust-version = "1.96"
description = "TOML-driven transparent HTTP(S) and DNS egress firewall using Rama"
license = "MIT"

[dependencies]
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.17"
hickory-proto = "0.25"
ipnet = { version = "2", features = ["serde"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
libc = "0.2"
rama = { version = "=0.4.0", features = ["http-full", "tcp", "rustls", "ring"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
notify = "8"
toml_edit = { version = "0.25", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
percent-encoding = "2"
# Decode captured HTTP bodies; the same versions are already built for rama.
brotli = "8"
flate2 = "1"
zstd = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# AGENTS.md requires a doc comment on every item, including private items and
# test helpers; `cargo clippy --all-targets -- -D warnings` enforces it.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
