name: Build and maybe release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') }}

jobs:
  build-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm build:ui

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: build-ui
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_name: exwall-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_name: exwall-aarch64-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
          merge-multiple: true

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # .cargo/config.toml points the musl targets at musl-gcc.
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify static Linux binary
        run: file target/${{ matrix.target }}/release/exwall | grep -Eq "static(-pie)? linked|statically linked"

      # Ship the installer and its inputs next to the binary so an extracted
      # release can be installed with `sudo ./install.sh`.
      - name: Package binary
        run: |
          set -euo pipefail
          package=${{ matrix.archive_name }}
          mkdir -p "$package/systemd"
          install -m 0755 target/${{ matrix.target }}/release/exwall "$package/exwall"
          install -m 0755 install.sh uninstall.sh "$package/"
          install -m 0644 config-default.toml example-rules.toml README.md LICENSE "$package/"
          install -m 0644 systemd/exwall.service "$package/systemd/"
          tar czf "$package.tar.gz" "$package"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.tar.gz

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
