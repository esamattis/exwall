# Available log_level values: "debug", "info", "warning", "error", "critical".
# The default is "info".
log_level = "info"

# Automatically reload the rules directory when its TOML files change.
# Invalid reloads keep the previous rules. SIGHUP applies changes to this option.
# The default is true.
watch_rules = true

# When true, DNS queries must match allow rules. Set to false to let the addon
# pass through all DNS queries while keeping the firewall redirection rules.
# The default is true.
block_dns = true

# Replace PVE-managed upstream nameservers in /etc/resolv.conf with
# systemd-resolved's loopback stub while mitmwall runs. Disable this when the
# system resolver configuration cannot or should not be replaced.
# The default is true.
manage_resolv_conf = true

# Compatibility setting: exwall validates this but stores no flow history.
# The default is 1000.
flow_history_clear_interval = 1000

# Compatibility setting: exwall validates this but stores no flow history.
# The default is 500. If trimming fails, mitmwall falls back to clearing all
# flow history entries.
flow_history_keep_entries = 500

# Existing local users that may connect directly to any network destination
# without passing through mitmwall. Root is included for host administration and
# troubleshooting. APT's _apt sandbox user is included so root-invoked package
# downloads retain their normal privilege separation. Remove either account to
# subject its traffic to mitmwall's proxy and outbound firewall policy.
bypass_users = ["root", "_apt"]

# Custom iptables bypass rules. Allow some IP ranges or ports to bypass the
# firewall and proxy. Bypassed traffic will not be visible in mitmweb and will
# not be subject to the addon rules.
# [[iptables.bypass]]
# network = "192.168.5.0/24"
# port = 1234

# Access logs are independent of log_level. Restart to apply these settings.
# Every check_interval entries, trim a file larger than max_size_bytes to its
# newest entries fitting in half of max_size_bytes.
[access_log]
path = "/var/log/exwall/access.log"
check_interval = 100
max_size_bytes = 10485760

# Embedded web UI. Restart to apply changes. Hosts are literal bind addresses.
# The default listens on every IPv4 address. Use ["127.0.0.1"] for localhost
# only, ["0.0.0.0", "::"] to add IPv6, or [] to disable the UI listener.
[ui]
hosts = ["0.0.0.0"]
port = 58000
# Set both credentials to enable login and HTTP Basic API authentication.
# Empty credentials disable API access. Protect this configuration file.
# install.sh fills these in; generate a new password with
# `sudo exwall ui-credentials`, or replace the values by hand.
# Changing credentials invalidates existing sessions after restart.
username = ""
password = ""
# Persistent bearer sessions expire after 365 days; browser storage is scoped to the UI origin.
sessions_dir = "/var/lib/exwall/ui/sessions/"
